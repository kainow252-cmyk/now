name: Build Android APK

on:
  push:
    branches: [ clean-now-ai, main ]
  pull_request:
    branches: [ clean-now-ai, main ]
  workflow_dispatch:  # Permite executar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      
    - name: Sync Capacitor
      run: |
        npx cap sync
        npx cap copy android
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build APK
      working-directory: android
      run: ./gradlew assembleDebug
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: now-ai-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/clean-now-ai' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-apk-${{ github.sha }}
        name: NOW AI APK - Build ${{ github.run_number }}
        body: |
          🎤 NOW AI - Assistente de Voz com TTS Nativo
          
          ✅ TTS 100% funcional no Android
          ✅ Voz feminina em português brasileiro
          ✅ Reconhecimento de voz à distância
          ✅ Interface limpa (apenas ORB)
          ✅ 30+ APIs integradas
          
          📲 **Como instalar:**
          1. Baixe o arquivo `app-debug.apk`
          2. No celular, autorize "Instalar de fontes desconhecidas"
          3. Abra o arquivo APK e instale
          4. Pronto! Fale com o NOW AI 🎉
          
          🔊 **Diferença do Web:**
          - Web (Chrome): ❌ Voz bloqueada
          - APK: ✅ Voz funciona 100%!
          
          📝 **Versão:** Debug (desenvolvimento)
          🏗️ **Build:** ${{ github.run_number }}
          📅 **Data:** ${{ github.event.head_commit.timestamp }}
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
