<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOW AI - Assistente Inteligente</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Orb Central */
    .orb-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin-bottom: 40px;
    }

    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, 
        rgba(0, 247, 255, 0.8), 
        rgba(0, 150, 255, 0.4), 
        rgba(138, 43, 226, 0.6)
      );
      box-shadow: 
        0 0 60px rgba(0, 247, 255, 0.6),
        inset 0 0 40px rgba(0, 150, 255, 0.4);
      animation: pulse 2s ease-in-out infinite;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .orb:hover {
      transform: scale(1.05);
      box-shadow: 
        0 0 80px rgba(0, 247, 255, 0.8),
        inset 0 0 60px rgba(0, 150, 255, 0.6);
    }

    .orb.listening {
      animation: pulse-fast 0.5s ease-in-out infinite;
      background: radial-gradient(circle at 30% 30%, 
        rgba(255, 0, 100, 0.8), 
        rgba(255, 50, 150, 0.6), 
        rgba(200, 0, 255, 0.4)
      );
      box-shadow: 
        0 0 100px rgba(255, 0, 100, 0.8),
        inset 0 0 60px rgba(255, 50, 150, 0.6);
    }

    .orb.thinking {
      animation: rotate 2s linear infinite;
      background: radial-gradient(circle at 30% 30%, 
        rgba(255, 200, 0, 0.8), 
        rgba(255, 150, 0, 0.6), 
        rgba(255, 100, 0, 0.4)
      );
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Status Text */
    .status-text {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 20px;
      height: 30px;
      opacity: 0.8;
    }

    /* Response Box (oculta por padrão) */
    .response-box {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      width: 90%;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 247, 255, 0.3);
      border-radius: 20px;
      padding: 20px 30px;
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      max-height: 200px;
      overflow-y: auto;
    }

    .response-box.show {
      opacity: 1;
      visibility: visible;
    }

    .response-box p {
      font-size: 16px;
      line-height: 1.6;
      color: #00f7ff;
    }

    /* Voice Button */
    .voice-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 247, 255, 0.2);
      border: 2px solid rgba(0, 247, 255, 0.5);
      cursor: pointer;
      display: none; /* OCULTO - ativa automaticamente por voz */
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .voice-button:hover {
      background: rgba(0, 247, 255, 0.4);
      border-color: rgba(0, 247, 255, 0.8);
      transform: translateX(-50%) scale(1.1);
    }

    .voice-button.active {
      background: rgba(255, 0, 100, 0.4);
      border-color: rgba(255, 0, 100, 0.8);
      animation: pulse-button 1s infinite;
    }

    @keyframes pulse-button {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 100, 0.5); }
      50% { box-shadow: 0 0 40px rgba(255, 0, 100, 0.8); }
    }

    .voice-icon {
      width: 35px;
      height: 35px;
      fill: #00f7ff;
    }

    .voice-button.active .voice-icon {
      fill: #ff0064;
    }

    /* Debug info */
    .debug-info {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 247, 255, 0.3);
      border-radius: 10px;
      padding: 15px;
      font-size: 12px;
      max-width: 250px;
      backdrop-filter: blur(5px);
      z-index: 1000;
    }

    .debug-info h4 {
      margin: 0 0 10px 0;
      color: #00f7ff;
      font-size: 14px;
    }

    .debug-info p {
      margin: 5px 0;
      opacity: 0.9;
    }

    .debug-info .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .debug-info .status-indicator.active {
      background: #00ff00;
      box-shadow: 0 0 5px #00ff00;
    }

    .debug-info .status-indicator.inactive {
      background: #ff0000;
      box-shadow: 0 0 5px #ff0000;
    }

    /* Loading dots */
    .loading-dots {
      display: inline-block;
      margin-left: 5px;
    }

    .loading-dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Scrollbar customizado */
    .response-box::-webkit-scrollbar {
      width: 6px;
    }

    .response-box::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    .response-box::-webkit-scrollbar-thumb {
      background: rgba(0, 247, 255, 0.5);
      border-radius: 10px;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .orb-container {
        width: 200px;
        height: 200px;
      }

      .status-text {
        font-size: 18px;
      }

      .response-box {
        font-size: 14px;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  
  <div class="status-text" id="status">Iniciando... aguarde 2 segundos</div>

  <!-- Debug Info -->
  <div class="debug-info" id="debugInfo">
    <h4>🔍 Status do Sistema</h4>
    <p>
      <span class="status-indicator" id="micStatus"></span>
      <span>Microfone: <span id="micText">Verificando...</span></span>
    </p>
    <p>
      <span class="status-indicator" id="listenStatus"></span>
      <span>Escuta: <span id="listenText">Aguardando...</span></span>
    </p>
    <p style="margin-top: 10px; font-size: 11px; opacity: 0.7;">
      Última detecção:<br>
      <span id="lastHeard">Nenhuma</span>
    </p>
  </div>
  
  <div class="orb-container">
    <div class="orb" id="orb"></div>
  </div>

  <div class="response-box" id="responseBox">
    <p id="responseText"></p>
  </div>
  
  <!-- SEM OVERLAY - Ativação 100% por voz -->

  <script>
    // Estado da aplicação
    const state = {
      isListening: false,
      isSpeaking: false,
      continuousMode: true,  // NOVO: modo contínuo ativo
      recognition: null,
      synthesis: window.speechSynthesis,
      lastSpeechTime: 0,
      voiceAuthEnabled: false,  // NOVO: autenticação por voz
      ownerProfile: null,  // NOVO: perfil do dono
      ttsUnlocked: false  // NOVO: TTS desbloqueado no mobile
    };

    // Elementos DOM
    const orb = document.getElementById('orb');
    const status = document.getElementById('status');
    const responseBox = document.getElementById('responseBox');
    const responseText = document.getElementById('responseText');
    // Botão removido - ativação 100% automática por voz
    
    // Debug elements
    const micStatus = document.getElementById('micStatus');
    const micText = document.getElementById('micText');
    const listenStatus = document.getElementById('listenStatus');
    const listenText = document.getElementById('listenText');
    const lastHeard = document.getElementById('lastHeard');

    // Inicializa reconhecimento de voz CONTÍNUO
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        console.error('Speech Recognition não suportado');
        status.textContent = 'Navegador não suporta reconhecimento de voz';
        return;
      }

      state.recognition = new SpeechRecognition();
      state.recognition.lang = 'pt-BR';
      state.recognition.continuous = true;  // CONTÍNUO!
      state.recognition.interimResults = true;  // Resultados parciais

      state.recognition.onstart = () => {
        console.log('🎤 NOW está escutando continuamente...');
        state.isListening = true;
        orb.classList.add('listening');
        orb.classList.remove('thinking'); // Remove estado de pensamento
        // voiceButton removido - apenas ORB visual
        status.textContent = 'NOW ouvindo... pode falar comigo';
        
        // Update debug info
        micStatus.className = 'status-indicator active';
        micText.textContent = 'Ativo ✓';
        listenStatus.className = 'status-indicator active';
        listenText.textContent = 'Escutando ✓';
      };

      state.recognition.onresult = async (event) => {
        const result = event.results[event.results.length - 1];
        const transcript = result[0].transcript.toLowerCase();
        
        // 🎯 DESBLOQUEIA TTS NA PRIMEIRA VOZ DETECTADA
        if (!state.ttsUnlocked && transcript.length > 2) {
          console.log('🔓 VOZ DETECTADA - Desbloqueando áudio automaticamente!');
          
          // Remove instrução visual
          const instruction = document.getElementById('clickInstruction');
          if (instruction) {
            instruction.style.transition = 'opacity 0.5s ease';
            instruction.style.opacity = '0';
            setTimeout(() => instruction.remove(), 500);
          }
          
          // 🔥 IMPORTANTE: Desbloqueia TTS IMEDIATAMENTE com fala REAL
          // (não pode usar setTimeout - precisa ser síncrono com o evento de voz)
          state.ttsUnlocked = true;
          console.log('✅ Áudio desbloqueado! Chamando speak() IMEDIATAMENTE...');
          
          // Chama speak() em modo IMEDIATO (no mesmo contexto do evento de voz)
          speak('NOW ativado! Pode falar comigo.', true);
        }
        
        // Update last heard
        lastHeard.textContent = `"${transcript}" ${result.isFinal ? '✓' : '...'}`;
        
        // Mostra o que está sendo ouvido na tela
        if (!result.isFinal) {
          status.textContent = `🎤 Ouvindo: "${transcript}"...`;
        }
        
        console.log('📝 Ouvido:', transcript, '(final:', result.isFinal + ')');
        
        // Detecta wake words múltiplas: "NOW", "AGORA", "NAU", etc
        const wakeWords = ['now', 'agora', 'nau', 'naul', 'no ', ' no'];
        const hasWakeWord = wakeWords.some(word => transcript.includes(word));
        
        // Detecta perguntas comuns mesmo sem wake word
        const commonQuestions = [
          'que horas', 'quantas horas', 'hora', 'horas',
          'que dia', 'dia é', 'data',
          'quem é você', 'quem você', 'o que você',
          'olá', 'oi', 'hello',
          'ajuda', 'help',
          'pode', 'responder', 'dólar', 'valor', 'preço',
          'quanto', 'custa', 'como', 'onde', 'quando', 'porque'
        ];
        const isCommonQuestion = commonQuestions.some(q => transcript.includes(q));
        
        // NOVO: Processa qualquer frase com 5+ palavras (provavelmente é pergunta)
        const wordCount = transcript.split(' ').length;
        const isLongPhrase = wordCount >= 5;
        
        // 🐛 DEBUG: Log detalhado
        console.log('🔍 Análise:', {
          transcript,
          hasWakeWord,
          isCommonQuestion,
          isLongPhrase,
          wordCount,
          isFinal: result.isFinal
        });
        
        if ((hasWakeWord || isCommonQuestion || isLongPhrase) && result.isFinal) {
          console.log('🎯 Comando detectado!');
          
          // NOVO: Verifica autenticação de voz SE estiver ativa (simplificado)
          if (state.voiceAuthEnabled && state.ownerProfile) {
            const isTrusted = await verifyVoice(transcript);
            
            if (!isTrusted) {
              status.textContent = '🚫 Voz não reconhecida';
              speak('Desculpe, não reconheço sua voz');
              
              setTimeout(() => {
                status.textContent = 'NOW ouvindo... pode falar comigo';
              }, 2000);
              return;
            }
          }
          
          // Toca som de confirmação
          playBeep();
          
          // Remove todas as wake words do texto
          let question = transcript;
          wakeWords.forEach(word => {
            question = question.replace(new RegExp(word, 'gi'), ' ');
          });
          
          // Remove espaços extras e limpa
          question = question.replace(/\s+/g, ' ').trim();
          
          // Se ficou vazio após limpar, usa o texto original
          if (question.length === 0) {
            question = transcript;
          }
          
          // Comando especial: "cadastro voz"
          if (question.includes('cadastro') && question.includes('voz')) {
            status.textContent = '🔧 Abrindo cadastro de voz...';
            speak('Abrindo página de cadastro de voz');
            
            setTimeout(() => {
              window.location.href = '/voice-setup.html?reconfig=true';
            }, 1500);
            return;
          }
          
          // Se tem pelo menos 3 caracteres, processa
          if (question.length >= 3) {
            console.log('✅ Processando pergunta:', question);
            status.textContent = '🎯 Pergunta detectada! Processando...';
            orb.classList.remove('listening');
            orb.classList.add('thinking');
            
            await processQuestion(question);
            
            // Volta a escutar após responder
            setTimeout(() => {
              if (state.continuousMode && !state.isSpeaking) {
                status.textContent = 'NOW ouvindo... pode falar comigo';
                orb.classList.remove('thinking');
                orb.classList.add('listening');
              }
            }, 1000);
          } else {
            status.textContent = 'NOW pronto! Pode perguntar...';
            // Se só falou "NOW", aguarda a pergunta
            setTimeout(() => {
              status.textContent = 'NOW ouvindo... pode falar comigo';
            }, 2000);
          }
        }
      };

      state.recognition.onerror = (event) => {
        console.error('❌ Erro:', event.error);
        
        // Update debug
        listenStatus.className = 'status-indicator inactive';
        listenText.textContent = `Erro: ${event.error}`;
        
        // Ignora erros de "no-speech" em modo contínuo
        if (event.error === 'no-speech' && state.continuousMode) {
          listenText.textContent = 'Aguardando fala...';
          return;
        }
        
        // Reinicia automaticamente em modo contínuo
        if (state.continuousMode && !state.isSpeaking) {
          setTimeout(() => {
            if (state.continuousMode) {
              console.log('🔄 Reiniciando reconhecimento...');
              listenText.textContent = 'Reiniciando...';
              state.recognition.start();
            }
          }, 1000);
        }
      };

      state.recognition.onend = () => {
        console.log('🔚 Reconhecimento parou');
        state.isListening = false;
        
        // Auto-restart em modo contínuo
        if (state.continuousMode && !state.isSpeaking) {
          setTimeout(() => {
            if (state.continuousMode) {
              console.log('🔄 Reiniciando modo contínuo...');
              try {
                state.recognition.start();
              } catch (e) {
                console.log('⚠️  Aguardando para reiniciar...');
              }
            }
          }, 500);
        } else {
          // voiceButton removido
          orb.classList.remove('listening', 'thinking');
          status.textContent = 'Clique para ativar voz';
        }
      };
    }

    // Processa pergunta e obtém resposta
    async function processQuestion(question) {
      try {
        console.log('📤 Processando pergunta:', question);
        
        // PRIMEIRO: Tenta resposta local IMEDIATA para perguntas simples
        const q = question.toLowerCase();
        const isSimpleQuestion = 
          q.includes('hora') || q.includes('horas') ||
          q.includes('data') || q.includes('dia') ||
          q.includes('olá') || q.includes('oi') ||
          q.includes('quem é você') || q.includes('o que você') ||
          q.includes('como você funciona') ||
          q.includes('ajuda') || q.includes('comandos');
        
        if (isSimpleQuestion) {
          console.log('✅ Usando resposta local (rápida)');
          const localAnswer = getLocalAnswer(question);
          console.log('📝 Resposta:', localAnswer);
          showResponse(localAnswer);
          console.log('🔊 Chamando speak()...');
          speak(localAnswer);
          return;
        }
        
        console.log('🌐 Buscando em APIs externas...');
        
        // Timeout de 10 segundos
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        // Tenta primeiro o endpoint NOW (com fallback inteligente)
        let response = await fetch('/api/now/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        let data = await response.json();
        console.log('📥 Resposta recebida:', data.success ? 'OK' : 'ERRO');
        
        if (data.success && data.answer) {
          console.log('📝 Resposta API:', data.answer.substring(0, 100));
          showResponse(data.answer);
          console.log('🔊 Chamando speak() com resposta API...');
          speak(data.answer);
          console.log('✓ speak() chamado para resposta API');
          return;
        }

        // Se falhou, tenta APIs de conhecimento gratuitas
        response = await fetch('/api/knowledge/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        data = await response.json();
        
        if (data.success) {
          const answer = formatKnowledgeResponse(data);
          showResponse(answer);
          speak(answer);
          return;
        }

        // Fallback local: respostas simples
        const localAnswer = getLocalAnswer(question);
        showResponse(localAnswer);
        speak(localAnswer);

      } catch (error) {
        console.error('❌ Erro ao processar:', error);
        
        // Mensagem de erro específica
        let errorMsg = 'Desculpe, tive um problema';
        if (error.name === 'AbortError') {
          errorMsg = 'Timeout - tentando novamente';
        }
        
        const localAnswer = getLocalAnswer(question);
        showResponse(errorMsg + '. ' + localAnswer);
        speak(localAnswer);
        
        // Garante que volta ao modo de escuta
        setTimeout(() => {
          orb.classList.remove('thinking');
          orb.classList.add('listening');
          status.textContent = 'NOW ouvindo... pode falar comigo';
        }, 2000);
      }
    }

    // Formata resposta das APIs de conhecimento
    function formatKnowledgeResponse(data) {
      if (data.summary) return data.summary;
      if (data.price) return `${data.coin} está cotado em $${data.price} USD`;
      if (data.temperature) return `Temperatura: ${data.temperature}°C`;
      if (data.articles) return `Principais notícias: ${data.articles[0]?.title || 'Nenhuma notícia disponível'}`;
      return JSON.stringify(data).slice(0, 200);
    }

    // Respostas locais simples (fallback offline)
    function getLocalAnswer(question) {
      const q = question.toLowerCase();
      
      if (q.includes('olá') || q.includes('oi')) {
        return 'Olá! Sou o NOW AI, seu assistente inteligente. Como posso ajudar?';
      }
      if (q.includes('quem é você') || q.includes('o que você é')) {
        return 'Sou o NOW AI, um assistente inteligente estilo JARVIS. Posso responder perguntas, buscar conhecimento e conversar naturalmente.';
      }
      if (q.includes('como você funciona')) {
        return 'Funciono com inteligência multi-camada: primeiro busco no conhecimento local, depois em APIs gratuitas, e por último uso IA avançada. Também aprendo sozinho a cada 30 minutos.';
      }
      if (q.includes('hora') || q.includes('horas')) {
        return `São ${new Date().toLocaleTimeString('pt-BR')} agora.`;
      }
      if (q.includes('data') || q.includes('dia')) {
        return `Hoje é ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
      }
      if (q.includes('ajuda') || q.includes('comandos')) {
        return 'Posso responder perguntas sobre tecnologia, ciência, hora, data e muito mais. Diga "NOW cadastro voz" para reconfigurar seu reconhecimento de voz.';
      }
      
      return 'Ainda estou aprendendo sobre isso. Meu conhecimento está crescendo automaticamente a cada 30 minutos!';
    }

    // Mostra resposta na tela
    function showResponse(text) {
      responseText.textContent = text;
      responseBox.classList.add('show');
      
      // Esconde após 10 segundos
      setTimeout(() => {
        responseBox.classList.remove('show');
      }, 10000);
    }

    // Toca beep de confirmação
    function playBeep() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 800; // Frequência em Hz
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    // Limpa texto para TTS (remove símbolos que causam problemas)
    function cleanTextForSpeech(text) {
      return text
        .replace(/R\$\s*/g, '') // Remove R$
        .replace(/\$\s*/g, '') // Remove $
        .replace(/°C/g, ' graus celsius') // Substitui °C
        .replace(/km\/h/g, ' quilômetros por hora') // Substitui km/h
        .replace(/%/g, ' por cento') // Substitui %
        .replace(/\d{4}-\d{2}-\d{2}/g, '') // Remove datas YYYY-MM-DD
        .replace(/\s+/g, ' ') // Remove espaços múltiplos
        .trim();
    }

    // Fala a resposta
    function speak(text, immediate = false) {
      console.log('🔊 ========= SPEAK CHAMADO =========');
      console.log('🔊 Texto original:', text.substring(0, 100));
      console.log('🔊 TTS desbloqueado?', state.ttsUnlocked);
      console.log('🔊 Modo imediato?', immediate);
      
      if (!text || text.trim().length === 0) {
        console.error('❌ Texto vazio! Não vai falar.');
        return;
      }
      
      // NOVO: Tenta falar SEMPRE, mesmo se bloqueado
      // Se falhar (not-allowed), resposta já está na tela
      if (!state.ttsUnlocked) {
        console.log('⚠️  TTS não desbloqueado ainda - tentando mesmo assim...');
        console.log('   Se falhar, resposta ficará apenas na tela');
      }
      
      // Limpa o texto
      const cleanText = cleanTextForSpeech(text);
      console.log('🔊 Texto limpo:', cleanText.substring(0, 100));
      
      // Verifica se TTS está disponível
      if (!state.synthesis) {
        console.error('❌ speechSynthesis não disponível!');
        return;
      }
      
      console.log('✓ speechSynthesis OK');
      console.log('   Speaking:', state.synthesis.speaking);
      console.log('   Paused:', state.synthesis.paused);
      console.log('   Pending:', state.synthesis.pending);
      
      if (state.synthesis.speaking) {
        console.log('⚠️  Cancelando fala anterior...');
        state.synthesis.cancel();
      }
      
      // FORÇAR resume() para mobile
      if (state.synthesis.paused) {
        console.log('▶️  Resumindo síntese pausada...');
        state.synthesis.resume();
      }

      // Função para criar e falar utterance
      const createAndSpeak = () => {
        console.log('⏱️  Criando utterance...');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9; // Um pouco mais devagar para ser mais claro
        utterance.pitch = 1.2; // Mais agudo = mais feminino
        utterance.volume = 1.0;
        console.log('✓ Utterance criado');

        // Carrega vozes se necessário
        let voices = state.synthesis.getVoices();
        
        if (voices.length === 0) {
          console.log('⚠️  Carregando vozes...');
          // Aguarda evento de carregamento de vozes
          state.synthesis.onvoiceschanged = () => {
            voices = state.synthesis.getVoices();
            console.log(`✅ ${voices.length} vozes carregadas`);
            setVoiceAndSpeak(utterance, voices, text);
          };
          // Tenta falar mesmo assim
          setVoiceAndSpeak(utterance, voices, text);
        } else {
          setVoiceAndSpeak(utterance, voices, text);
        }
      };
      
      // Se imediato (primeira vez, contexto de user gesture), chama agora
      // Senão, aguarda 100ms para garantir que cancelou
      if (immediate) {
        console.log('⚡ MODO IMEDIATO - Falando agora (contexto user gesture)');
        createAndSpeak();
      } else {
        setTimeout(createAndSpeak, 100);
      }
    }

    // Configura voz e fala
    function setVoiceAndSpeak(utterance, voices, text) {
      // Tenta usar voz FEMININA em português
      console.log(`🔍 Procurando voz feminina entre ${voices.length} vozes...`);
      
      // Lista todas as vozes PT para debug
      const ptVoices = voices.filter(v => v.lang.startsWith('pt'));
      console.log('🗣️  Vozes PT disponíveis:', ptVoices.map(v => `${v.name} (${v.lang})`));
      
      // Prioridade 1: Vozes com "female" explícito
      let femaleVoice = ptVoices.find(v => 
        v.name.toLowerCase().includes('female') ||
        v.name.toLowerCase().includes('feminina')
      );
      
      // Prioridade 2: Vozes com nomes femininos
      if (!femaleVoice) {
        femaleVoice = ptVoices.find(v => 
          v.name.toLowerCase().includes('luciana') ||
          v.name.toLowerCase().includes('marcia') ||
          v.name.toLowerCase().includes('maria') ||
          v.name.toLowerCase().includes('ana')
        );
      }
      
      // Prioridade 3: Google pt-BR (geralmente feminina)
      if (!femaleVoice) {
        femaleVoice = ptVoices.find(v => 
          v.name.toLowerCase().includes('google') && v.lang === 'pt-BR'
        );
      }
      
      // Prioridade 4: Qualquer voz PT-BR que NÃO seja masculina
      if (!femaleVoice) {
        femaleVoice = ptVoices.find(v => 
          !v.name.toLowerCase().includes('male') &&
          !v.name.toLowerCase().includes('masculino') &&
          v.lang === 'pt-BR'
        );
      }
      
      const selectedVoice = femaleVoice || ptVoices[0] || voices[0];
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        console.log(`🎤 Voz selecionada: ${selectedVoice.name} (${selectedVoice.lang})`);
        console.log(`   É feminina? ${selectedVoice.name.toLowerCase().includes('female') || selectedVoice.name.toLowerCase().includes('feminina') ? 'SIM' : 'TALVEZ'}`);
      } else {
        console.log('⚠️  Nenhuma voz encontrada, usando padrão');
      }

      utterance.onstart = () => {
        console.log('▶️  Iniciando fala...');
        state.isSpeaking = true;
        orb.classList.remove('thinking', 'listening');
        status.textContent = '🔊 Falando...';
        
        // 🔇 PAUSA reconhecimento para não ouvir a própria voz
        if (state.recognition && state.isListening) {
          console.log('🔇 Pausando reconhecimento (falando)...');
          try {
            state.recognition.stop();
          } catch (e) {
            console.log('   (já parado)');
          }
        }
      };

      utterance.onend = () => {
        console.log('✅ Fala concluída');
        state.isSpeaking = false;
        
        // 🔊 REINICIA reconhecimento após falar
        if (state.continuousMode) {
          setTimeout(() => {
            orb.classList.add('listening');
            status.textContent = 'NOW ouvindo... pode falar comigo';
            
            // Reinicia reconhecimento
            if (state.recognition) {
              console.log('🔊 Reiniciando reconhecimento...');
              try {
                state.recognition.start();
              } catch (e) {
                console.log('   (reconhecimento já ativo)');
              }
            }
          }, 1000);  // Espera 1s após falar para evitar eco
        } else {
          orb.classList.remove('listening', 'thinking');
          status.textContent = 'Clique para ativar voz';
        }
      };

      utterance.onerror = (event) => {
        console.error('❌ Erro TTS:', event.error);
        state.isSpeaking = false;
        
        // Ignora erros comuns do TTS
        if (event.error === 'interrupted' || event.error === 'canceled') {
          console.log('   (erro ignorado - normal)');
        }
        
        // Volta a escutar silenciosamente
        if (state.continuousMode) {
          setTimeout(() => {
            orb.classList.remove('thinking');
            orb.classList.add('listening');
            status.textContent = 'NOW ouvindo... pode falar comigo';
          }, 500);
        }
      };

      try {
        console.log('🚀 Chamando speak()...');
        console.log('   Texto:', text.substring(0, 50) + '...');
        console.log('   Lang:', utterance.lang);
        console.log('   Voice:', utterance.voice?.name || 'default');
        
        state.synthesis.speak(utterance);
        console.log('✓ speak() chamado');
        
        // FORÇAR no mobile
        setTimeout(() => {
          if (!state.isSpeaking) {
            console.log('⚠️  TTS não iniciou, tentando resume()...');
            state.synthesis.resume();
          }
        }, 200);
      } catch (error) {
        console.error('❌ Erro ao chamar speak():', error);
      }
    }

    // Inicia/para escuta contínua
    function toggleListening() {
      // NOVO: No primeiro clique, desbloqueia TTS no mobile
      if (!state.ttsUnlocked) {
        console.log('🔓 Primeiro toque - desbloqueando TTS no mobile...');
        const dummyUtterance = new SpeechSynthesisUtterance('');
        state.synthesis.speak(dummyUtterance);
        state.ttsUnlocked = true;
        
        // Fala uma mensagem de boas-vindas
        setTimeout(() => {
          speak('NOW ativado! Pode falar.');
        }, 300);
      }
      
      state.continuousMode = !state.continuousMode;
      
      if (state.continuousMode) {
        console.log('▶️  Modo contínuo ATIVADO');
        status.textContent = 'NOW ouvindo... (diga "AGORA" + pergunta)';
        state.recognition.start();
      } else {
        console.log('⏸️  Modo contínuo DESATIVADO');
        status.textContent = 'Modo contínuo desativado. Clique para reativar.';
        state.recognition.stop();
        orb.classList.remove('listening', 'thinking');
        // voiceButton removido
      }
    }

    // Event listeners - REMOVIDOS, sistema 100% automático
    // Não precisa mais de cliques para ativar

    // Inicializa quando a página carregar
    window.addEventListener('load', () => {
      initSpeechRecognition();
      
      // Carrega vozes (necessário para alguns navegadores)
      if (state.synthesis.onvoiceschanged !== undefined) {
        state.synthesis.onvoiceschanged = () => {
          state.synthesis.getVoices();
        };
      }

      console.log('✅ NOW AI iniciado!');
      console.log('🎤 Modo contínuo ativo - Diga "AGORA" ou "NOW" seguido de sua pergunta');
      
      // Carrega perfil de voz
      loadVoiceProfile();
      
      // 🎤 ATIVAÇÃO 100% POR VOZ - SEM TOQUES, SEM CLIQUES
      // Sistema tenta desbloquear TTS automaticamente quando detecta primeira voz
      // Se TTS falhar (not-allowed), respostas aparecem APENAS NA TELA até funcionar
      console.log('💬 Modo visual ativo: respostas aparecem na tela');
      
      // INICIA ESCUTA AUTOMATICAMENTE
      setTimeout(() => {
        console.log('🚀 Ativando escuta contínua automaticamente...');
        console.log('🎤 Sistema 100% automático - apenas fale!');
        status.textContent = 'NOW ouvindo... pode falar comigo';
        
        try {
          state.recognition.start();
          console.log('✅ Reconhecimento de voz ativo - aguardando sua voz...');
        } catch (e) {
          console.log('⚠️  Aguarde um momento...');
        }
      }, 1000);  // Reduzido para 1 segundo (mais rápido)
    });

    // Carrega perfil de voz do localStorage
    function loadVoiceProfile() {
      const profileData = localStorage.getItem('now-voice-profile');
      
      if (profileData) {
        state.ownerProfile = JSON.parse(profileData);
        state.voiceAuthEnabled = state.ownerProfile.enabled;
        
        if (state.voiceAuthEnabled) {
          console.log('🔒 Autenticação de voz ATIVADA');
          console.log(`   Perfil criado em: ${new Date(state.ownerProfile.createdAt).toLocaleString()}`);
        }
      } else {
        console.log('⚠️  Nenhum perfil de voz cadastrado');
        console.log('   Acesse /voice-setup.html para cadastrar');
      }
    }

    // Verifica se a voz é do dono (autenticação simplificada)
    async function verifyVoice(transcript) {
      if (!state.voiceAuthEnabled || !state.ownerProfile) {
        return true; // Se não tem autenticação, aceita qualquer voz
      }

      try {
        // Análise simples: aceita sempre se tiver perfil cadastrado
        // Em produção real, usaria Web Audio API para análise de frequência
        // Por enquanto, apenas verifica se o perfil existe
        return true; // TODO: Implementar análise real de áudio
      } catch (error) {
        return true; // Em caso de erro, aceita para não bloquear
      }
    }

    // Atalho de teclado (Espaço para toggle)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleListening();
      }
    });

    // NOVO: Desbloqueia TTS com qualquer interação do usuário
    function unlockAudio() {
      if (!state.ttsUnlocked) {
        console.log('🔓 Desbloqueando áudio com interação do usuário...');
        
        // Tenta tocar um som vazio
        const dummyUtterance = new SpeechSynthesisUtterance(' ');
        state.synthesis.speak(dummyUtterance);
        
        // Força resume
        setTimeout(() => {
          state.synthesis.cancel();
          state.synthesis.resume();
        }, 100);
        
        state.ttsUnlocked = true;
        console.log('✅ Áudio desbloqueado!');
      }
    }

    // Adiciona listeners para desbloquear
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    orb.addEventListener('click', unlockAudio);
  </script>
