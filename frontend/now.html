<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOW AI - Assistente Inteligente</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Orb Central */
    .orb-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin-bottom: 40px;
    }

    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, 
        rgba(0, 247, 255, 0.8), 
        rgba(0, 150, 255, 0.4), 
        rgba(138, 43, 226, 0.6)
      );
      box-shadow: 
        0 0 60px rgba(0, 247, 255, 0.6),
        inset 0 0 40px rgba(0, 150, 255, 0.4);
      animation: pulse 2s ease-in-out infinite;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .orb:hover {
      transform: scale(1.05);
      box-shadow: 
        0 0 80px rgba(0, 247, 255, 0.8),
        inset 0 0 60px rgba(0, 150, 255, 0.6);
    }

    .orb.listening {
      animation: pulse-fast 0.5s ease-in-out infinite;
      background: radial-gradient(circle at 30% 30%, 
        rgba(255, 0, 100, 0.8), 
        rgba(255, 50, 150, 0.6), 
        rgba(200, 0, 255, 0.4)
      );
      box-shadow: 
        0 0 100px rgba(255, 0, 100, 0.8),
        inset 0 0 60px rgba(255, 50, 150, 0.6);
    }

    .orb.thinking {
      animation: rotate 2s linear infinite;
      background: radial-gradient(circle at 30% 30%, 
        rgba(255, 200, 0, 0.8), 
        rgba(255, 150, 0, 0.6), 
        rgba(255, 100, 0, 0.4)
      );
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Status Text */
    .status-text {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 20px;
      height: 30px;
      opacity: 0.8;
    }

    /* Response Box (oculta por padrão) */
    .response-box {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      width: 90%;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 247, 255, 0.3);
      border-radius: 20px;
      padding: 20px 30px;
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      max-height: 200px;
      overflow-y: auto;
    }

    .response-box.show {
      opacity: 1;
      visibility: visible;
    }

    .response-box p {
      font-size: 16px;
      line-height: 1.6;
      color: #00f7ff;
    }

    /* Voice Button */
    .voice-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 247, 255, 0.2);
      border: 2px solid rgba(0, 247, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .voice-button:hover {
      background: rgba(0, 247, 255, 0.4);
      border-color: rgba(0, 247, 255, 0.8);
      transform: translateX(-50%) scale(1.1);
    }

    .voice-button.active {
      background: rgba(255, 0, 100, 0.4);
      border-color: rgba(255, 0, 100, 0.8);
      animation: pulse-button 1s infinite;
    }

    @keyframes pulse-button {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 100, 0.5); }
      50% { box-shadow: 0 0 40px rgba(255, 0, 100, 0.8); }
    }

    .voice-icon {
      width: 35px;
      height: 35px;
      fill: #00f7ff;
    }

    .voice-button.active .voice-icon {
      fill: #ff0064;
    }

    /* Debug info */
    .debug-info {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 247, 255, 0.3);
      border-radius: 10px;
      padding: 15px;
      font-size: 12px;
      max-width: 250px;
      backdrop-filter: blur(5px);
      z-index: 1000;
    }

    .debug-info h4 {
      margin: 0 0 10px 0;
      color: #00f7ff;
      font-size: 14px;
    }

    .debug-info p {
      margin: 5px 0;
      opacity: 0.9;
    }

    .debug-info .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .debug-info .status-indicator.active {
      background: #00ff00;
      box-shadow: 0 0 5px #00ff00;
    }

    .debug-info .status-indicator.inactive {
      background: #ff0000;
      box-shadow: 0 0 5px #ff0000;
    }

    /* Loading dots */
    .loading-dots {
      display: inline-block;
      margin-left: 5px;
    }

    .loading-dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Scrollbar customizado */
    .response-box::-webkit-scrollbar {
      width: 6px;
    }

    .response-box::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    .response-box::-webkit-scrollbar-thumb {
      background: rgba(0, 247, 255, 0.5);
      border-radius: 10px;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .orb-container {
        width: 200px;
        height: 200px;
      }

      .status-text {
        font-size: 18px;
      }

      .response-box {
        font-size: 14px;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  
  <div class="status-text" id="status">Iniciando... aguarde 2 segundos</div>

  <!-- Debug Info -->
  <div class="debug-info" id="debugInfo">
    <h4>🔍 Status do Sistema</h4>
    <p>
      <span class="status-indicator" id="micStatus"></span>
      <span>Microfone: <span id="micText">Verificando...</span></span>
    </p>
    <p>
      <span class="status-indicator" id="listenStatus"></span>
      <span>Escuta: <span id="listenText">Aguardando...</span></span>
    </p>
    <p style="margin-top: 10px; font-size: 11px; opacity: 0.7;">
      Última detecção:<br>
      <span id="lastHeard">Nenhuma</span>
    </p>
  </div>
  
  <div class="orb-container">
    <div class="orb" id="orb"></div>
  </div>

  <div class="response-box" id="responseBox">
    <p id="responseText"></p>
  </div>

  <div class="voice-button" id="voiceButton">
    <svg class="voice-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </div>

  <script>
    // Estado da aplicação
    const state = {
      isListening: false,
      isSpeaking: false,
      continuousMode: true,  // NOVO: modo contínuo ativo
      recognition: null,
      synthesis: window.speechSynthesis,
      lastSpeechTime: 0,
      voiceAuthEnabled: false,  // NOVO: autenticação por voz
      ownerProfile: null  // NOVO: perfil do dono
    };

    // Elementos DOM
    const orb = document.getElementById('orb');
    const status = document.getElementById('status');
    const responseBox = document.getElementById('responseBox');
    const responseText = document.getElementById('responseText');
    const voiceButton = document.getElementById('voiceButton');
    
    // Debug elements
    const micStatus = document.getElementById('micStatus');
    const micText = document.getElementById('micText');
    const listenStatus = document.getElementById('listenStatus');
    const listenText = document.getElementById('listenText');
    const lastHeard = document.getElementById('lastHeard');

    // Inicializa reconhecimento de voz CONTÍNUO
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        console.error('Speech Recognition não suportado');
        status.textContent = 'Navegador não suporta reconhecimento de voz';
        return;
      }

      state.recognition = new SpeechRecognition();
      state.recognition.lang = 'pt-BR';
      state.recognition.continuous = true;  // CONTÍNUO!
      state.recognition.interimResults = true;  // Resultados parciais

      state.recognition.onstart = () => {
        console.log('🎤 NOW está escutando continuamente...');
        state.isListening = true;
        orb.classList.add('listening');
        voiceButton.classList.add('active');
        status.textContent = '🎤 Escutando... Diga "AGORA" + sua pergunta';
        
        // Update debug info
        micStatus.className = 'status-indicator active';
        micText.textContent = 'Ativo ✓';
        listenStatus.className = 'status-indicator active';
        listenText.textContent = 'Escutando ✓';
      };

      state.recognition.onresult = async (event) => {
        const result = event.results[event.results.length - 1];
        const transcript = result[0].transcript.toLowerCase();
        
        // Update last heard
        lastHeard.textContent = `"${transcript}" ${result.isFinal ? '✓' : '...'}`;
        
        // Mostra o que está sendo ouvido na tela
        if (!result.isFinal) {
          status.textContent = `🎤 Ouvindo: "${transcript}"...`;
        }
        
        console.log('📝 Ouvido:', transcript, '(final:', result.isFinal + ')');
        
        // Detecta wake words múltiplas: "NOW", "AGORA", "NAU", etc
        const wakeWords = ['now', 'agora', 'nau', 'naul', 'no ', ' no'];
        const hasWakeWord = wakeWords.some(word => transcript.includes(word));
        
        // Detecta perguntas comuns mesmo sem wake word
        const commonQuestions = [
          'que horas', 'quantas horas', 'hora', 'horas',
          'que dia', 'dia é', 'data',
          'quem é você', 'quem você', 'o que você',
          'olá', 'oi', 'hello',
          'ajuda', 'help',
          'pode', 'responder', 'dólar', 'valor', 'preço',
          'quanto', 'custa', 'como', 'onde', 'quando', 'porque'
        ];
        const isCommonQuestion = commonQuestions.some(q => transcript.includes(q));
        
        // NOVO: Processa qualquer frase com 5+ palavras (provavelmente é pergunta)
        const wordCount = transcript.split(' ').length;
        const isLongPhrase = wordCount >= 5;
        
        if ((hasWakeWord || isCommonQuestion || isLongPhrase) && result.isFinal) {
          console.log('🎯 Comando detectado!');
          
          // Toca som de confirmação
          playBeep();
          
          // Remove todas as wake words do texto
          let question = transcript;
          wakeWords.forEach(word => {
            question = question.replace(new RegExp(word, 'gi'), ' ');
          });
          
          // Remove espaços extras e limpa
          question = question.replace(/\s+/g, ' ').trim();
          
          // Se ficou vazio após limpar, usa o texto original
          if (question.length === 0) {
            question = transcript;
          }
          
          // Comando especial: "cadastro voz"
          if (question.includes('cadastro') && question.includes('voz')) {
            status.textContent = '🔧 Abrindo cadastro de voz...';
            speak('Abrindo página de cadastro de voz');
            
            setTimeout(() => {
              window.location.href = '/voice-setup.html?reconfig=true';
            }, 1500);
            return;
          }
          
          // Se tem pelo menos 3 caracteres, processa
          if (question.length >= 3) {
            status.textContent = '🎯 Pergunta detectada! Processando...';
            orb.classList.remove('listening');
            orb.classList.add('thinking');
            
            await processQuestion(question);
            
            // Volta a escutar após responder
            setTimeout(() => {
              if (state.continuousMode && !state.isSpeaking) {
                status.textContent = 'NOW ouvindo... (diga "NOW" para ativar)';
                orb.classList.remove('thinking');
                orb.classList.add('listening');
              }
            }, 1000);
          } else {
            status.textContent = 'NOW pronto! Pode perguntar...';
            // Se só falou "NOW", aguarda a pergunta
            setTimeout(() => {
              status.textContent = 'NOW ouvindo... (diga "NOW" para ativar)';
            }, 2000);
          }
        }
      };

      state.recognition.onerror = (event) => {
        console.error('❌ Erro:', event.error);
        
        // Update debug
        listenStatus.className = 'status-indicator inactive';
        listenText.textContent = `Erro: ${event.error}`;
        
        // Ignora erros de "no-speech" em modo contínuo
        if (event.error === 'no-speech' && state.continuousMode) {
          listenText.textContent = 'Aguardando fala...';
          return;
        }
        
        // Reinicia automaticamente em modo contínuo
        if (state.continuousMode && !state.isSpeaking) {
          setTimeout(() => {
            if (state.continuousMode) {
              console.log('🔄 Reiniciando reconhecimento...');
              listenText.textContent = 'Reiniciando...';
              state.recognition.start();
            }
          }, 1000);
        }
      };

      state.recognition.onend = () => {
        console.log('🔚 Reconhecimento parou');
        state.isListening = false;
        
        // Auto-restart em modo contínuo
        if (state.continuousMode && !state.isSpeaking) {
          setTimeout(() => {
            if (state.continuousMode) {
              console.log('🔄 Reiniciando modo contínuo...');
              try {
                state.recognition.start();
              } catch (e) {
                console.log('⚠️  Aguardando para reiniciar...');
              }
            }
          }, 500);
        } else {
          voiceButton.classList.remove('active');
          orb.classList.remove('listening', 'thinking');
          status.textContent = 'Clique para ativar voz';
        }
      };
    }

    // Processa pergunta e obtém resposta
    async function processQuestion(question) {
      try {
        // Tenta primeiro o endpoint NOW (com fallback inteligente)
        let response = await fetch('/api/now/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        let data = await response.json();
        
        if (data.success && data.answer) {
          showResponse(data.answer);
          speak(data.answer);
          return;
        }

        // Se falhou, tenta APIs de conhecimento gratuitas
        response = await fetch('/api/knowledge/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        data = await response.json();
        
        if (data.success) {
          const answer = formatKnowledgeResponse(data);
          showResponse(answer);
          speak(answer);
          return;
        }

        // Fallback local: respostas simples
        const localAnswer = getLocalAnswer(question);
        showResponse(localAnswer);
        speak(localAnswer);

      } catch (error) {
        console.error('❌ Erro ao processar:', error);
        const localAnswer = getLocalAnswer(question);
        showResponse(localAnswer);
        speak(localAnswer);
      }
    }

    // Formata resposta das APIs de conhecimento
    function formatKnowledgeResponse(data) {
      if (data.summary) return data.summary;
      if (data.price) return `${data.coin} está cotado em $${data.price} USD`;
      if (data.temperature) return `Temperatura: ${data.temperature}°C`;
      if (data.articles) return `Principais notícias: ${data.articles[0]?.title || 'Nenhuma notícia disponível'}`;
      return JSON.stringify(data).slice(0, 200);
    }

    // Respostas locais simples (fallback offline)
    function getLocalAnswer(question) {
      const q = question.toLowerCase();
      
      if (q.includes('olá') || q.includes('oi')) {
        return 'Olá! Sou o NOW AI, seu assistente inteligente. Como posso ajudar?';
      }
      if (q.includes('quem é você') || q.includes('o que você é')) {
        return 'Sou o NOW AI, um assistente inteligente estilo JARVIS. Posso responder perguntas, buscar conhecimento e conversar naturalmente.';
      }
      if (q.includes('como você funciona')) {
        return 'Funciono com inteligência multi-camada: primeiro busco no conhecimento local, depois em APIs gratuitas, e por último uso IA avançada. Também aprendo sozinho a cada 30 minutos.';
      }
      if (q.includes('hora') || q.includes('horas')) {
        return `São ${new Date().toLocaleTimeString('pt-BR')} agora.`;
      }
      if (q.includes('data') || q.includes('dia')) {
        return `Hoje é ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
      }
      if (q.includes('ajuda') || q.includes('comandos')) {
        return 'Posso responder perguntas sobre tecnologia, ciência, hora, data e muito mais. Diga "NOW cadastro voz" para reconfigurar seu reconhecimento de voz.';
      }
      
      return 'Ainda estou aprendendo sobre isso. Meu conhecimento está crescendo automaticamente a cada 30 minutos!';
    }

    // Mostra resposta na tela
    function showResponse(text) {
      responseText.textContent = text;
      responseBox.classList.add('show');
      
      // Esconde após 10 segundos
      setTimeout(() => {
        responseBox.classList.remove('show');
      }, 10000);
    }

    // Toca beep de confirmação
    function playBeep() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 800; // Frequência em Hz
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    // Fala a resposta
    function speak(text) {
      console.log('🔊 Tentando falar:', text);
      
      if (state.synthesis.speaking) {
        console.log('⚠️  Cancelando fala anterior...');
        state.synthesis.cancel();
      }

      // Aguarda um momento para garantir que cancelou
      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        // Carrega vozes se necessário
        let voices = state.synthesis.getVoices();
        
        if (voices.length === 0) {
          console.log('⚠️  Carregando vozes...');
          // Aguarda evento de carregamento de vozes
          state.synthesis.onvoiceschanged = () => {
            voices = state.synthesis.getVoices();
            console.log(`✅ ${voices.length} vozes carregadas`);
            setVoiceAndSpeak(utterance, voices, text);
          };
          // Tenta falar mesmo assim
          setVoiceAndSpeak(utterance, voices, text);
        } else {
          setVoiceAndSpeak(utterance, voices, text);
        }
      }, 100);
    }

    // Configura voz e fala
    function setVoiceAndSpeak(utterance, voices, text) {
      // Tenta usar voz em português
      const ptVoice = voices.find(v => v.lang.startsWith('pt')) || voices[0];
      
      if (ptVoice) {
        utterance.voice = ptVoice;
        console.log(`🎤 Usando voz: ${ptVoice.name} (${ptVoice.lang})`);
      } else {
        console.log('⚠️  Nenhuma voz encontrada, usando padrão');
      }

      utterance.onstart = () => {
        console.log('▶️  Iniciando fala...');
        state.isSpeaking = true;
        orb.classList.remove('thinking', 'listening');
        status.textContent = '🔊 Falando...';
      };

      utterance.onend = () => {
        console.log('✅ Fala concluída');
        state.isSpeaking = false;
        
        // Volta ao modo de escuta contínua
        if (state.continuousMode) {
          setTimeout(() => {
            orb.classList.add('listening');
            status.textContent = '🎤 Escutando... Diga "AGORA" + sua pergunta';
          }, 500);
        } else {
          orb.classList.remove('listening', 'thinking');
          status.textContent = 'Clique para ativar voz';
        }
      };

      utterance.onerror = (event) => {
        console.error('❌ Erro ao falar:', event.error);
        state.isSpeaking = false;
        
        // Volta a escutar mesmo com erro
        if (state.continuousMode) {
          orb.classList.add('listening');
          status.textContent = '⚠️  Erro de voz. Escutando...';
        }
      };

      try {
        console.log('🚀 Chamando speak()...');
        state.synthesis.speak(utterance);
        console.log('✓ speak() chamado com sucesso');
      } catch (error) {
        console.error('❌ Erro ao chamar speak():', error);
      }
    }

    // Inicia/para escuta contínua
    function toggleListening() {
      state.continuousMode = !state.continuousMode;
      
      if (state.continuousMode) {
        console.log('▶️  Modo contínuo ATIVADO');
        status.textContent = 'NOW ouvindo... (diga "NOW" para ativar)';
        state.recognition.start();
      } else {
        console.log('⏸️  Modo contínuo DESATIVADO');
        status.textContent = 'Modo contínuo desativado. Clique para reativar.';
        state.recognition.stop();
        orb.classList.remove('listening', 'thinking');
        voiceButton.classList.remove('active');
      }
    }

    // Event listeners
    orb.addEventListener('click', toggleListening);
    voiceButton.addEventListener('click', toggleListening);

    // Inicializa quando a página carregar
    window.addEventListener('load', () => {
      initSpeechRecognition();
      
      // Carrega vozes (necessário para alguns navegadores)
      if (state.synthesis.onvoiceschanged !== undefined) {
        state.synthesis.onvoiceschanged = () => {
          state.synthesis.getVoices();
        };
      }

      console.log('✅ NOW AI iniciado!');
      console.log('🎤 Modo contínuo ativo - Diga "AGORA" ou "NOW" seguido de sua pergunta');
      
      // Carrega perfil de voz
      loadVoiceProfile();
      
      // INICIA AUTOMATICAMENTE em modo contínuo após 2 segundos
      setTimeout(() => {
        console.log('🚀 Ativando escuta contínua automaticamente...');
        status.textContent = 'NOW ouvindo... (diga "NOW" para ativar)';
        try {
          state.recognition.start();
        } catch (e) {
          console.log('⚠️  Aguarde um momento...');
        }
      }, 2000);
    });

    // Carrega perfil de voz do localStorage
    function loadVoiceProfile() {
      const profileData = localStorage.getItem('now-voice-profile');
      
      if (profileData) {
        state.ownerProfile = JSON.parse(profileData);
        state.voiceAuthEnabled = state.ownerProfile.enabled;
        
        if (state.voiceAuthEnabled) {
          console.log('🔒 Autenticação de voz ATIVADA');
          console.log(`   Perfil criado em: ${new Date(state.ownerProfile.createdAt).toLocaleString()}`);
        }
      } else {
        console.log('⚠️  Nenhum perfil de voz cadastrado');
        console.log('   Acesse /voice-setup.html para cadastrar');
      }
    }

    // Atalho de teclado (Espaço para toggle)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleListening();
      }
    });
  </script>

</body>
</html>
